# Merge into a trusted project's .codex/config.toml.
# Keep the referenced policy owner-only and outside every repository.
[mcp_servers.m365_read]
command = "/absolute/path/to/m365-secure-mcp/.venv/bin/m365-secure-mcp"
args = ["--policy-file", "/absolute/private/path/read-policy.json"]
cwd = "/absolute/path/to/m365-secure-mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "prompt"
