# Merge into a trusted project's .codex/config.toml.
# Replace all placeholders. Client and tenant IDs are public identifiers, not secrets.
[mcp_servers.m365_read]
command = "/absolute/path/to/m365-secure-mcp/.venv/bin/m365-secure-mcp"
cwd = "/absolute/path/to/m365-secure-mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "prompt"

[mcp_servers.m365_read.env]
M365_TENANT_ID = "00000000-0000-0000-0000-000000000000"
M365_CLIENT_ID = "00000000-0000-0000-0000-000000000000"
M365_PROFILE = "read"
M365_MODULES = "profile,mail,calendar,files"
M365_ALLOWED_USER_OBJECT_IDS = "00000000-0000-0000-0000-000000000000"
M365_ALLOWED_UPN_DOMAINS = "example.com"
M365_ALLOWED_RECIPIENT_DOMAINS = "example.com"
M365_AUTH_FLOW = "interactive"
M365_ALLOW_DEVICE_CODE = "false"
M365_TOKEN_CACHE_MODE = "keyring"
