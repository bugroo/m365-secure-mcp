# Intentionally disabled. Enable only for a short, approved write session.
[mcp_servers.m365_write]
command = "/absolute/path/to/m365-secure-mcp/.venv/bin/m365-secure-mcp"
args = ["--policy-file", "/absolute/private/path/write-policy.json"]
cwd = "/absolute/path/to/m365-secure-mcp"
enabled = false
required = false
default_tools_approval_mode = "prompt"

[mcp_servers.m365_write.tools.m365_create_mail_draft]
approval_mode = "prompt"
[mcp_servers.m365_write.tools.m365_send_mail_draft]
approval_mode = "prompt"

[mcp_servers.m365_write.tools.m365_create_calendar_event]
approval_mode = "prompt"

[mcp_servers.m365_write.tools.m365_create_planner_task]
approval_mode = "prompt"

[mcp_servers.m365_write.tools.m365_update_planner_task]
approval_mode = "prompt"

[mcp_servers.m365_write.tools.m365_update_planner_task_details]
approval_mode = "prompt"
