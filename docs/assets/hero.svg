<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">M365 Secure MCP</title>
  <desc id="description">Policy-bound Microsoft Graph operations with structured evidence for local AI clients.</desc>
  <style>
    .surface { fill: #f2f3f1; }
    .ink { fill: #191b1f; }
    .muted { fill: #62676f; }
    .rule { stroke: #858a85; }
    .accent-fill { fill: #b4412f; }
    .accent-text { fill: #b4412f; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #191b1f; }
      .ink { fill: #f0f1ed; }
      .muted { fill: #a8aca5; }
      .rule { stroke: #70757c; }
      .accent-fill { fill: #e97a62; }
      .accent-text { fill: #e97a62; }
    }
  </style>

  <rect class="surface" width="1200" height="520"/>
  <rect class="accent-fill" x="0" y="0" width="1200" height="12"/>

  <g class="sans">
    <text class="muted" x="64" y="68" font-size="14" font-weight="700" letter-spacing="2.6">MICROSOFT GRAPH / MODEL CONTEXT PROTOCOL</text>

    <text class="ink" x="60" y="180" font-size="94" font-weight="800" letter-spacing="-5">M365</text>
    <text class="ink" x="60" y="270" font-size="94" font-weight="800" letter-spacing="-5">SECURE MCP</text>

    <text class="muted" x="66" y="326" font-size="22" font-weight="450">Policy-bound Graph operations for Codex, Claude Code,</text>
    <text class="muted" x="66" y="357" font-size="22" font-weight="450">and other local MCP clients.</text>
  </g>

  <g transform="translate(716 64)">
    <text class="accent-text mono" x="0" y="2" font-size="13" font-weight="700" letter-spacing="1.8">REQUEST BOUNDARY</text>
    <text class="ink sans" x="0" y="45" font-size="23" font-weight="650">The model cannot choose</text>
    <text class="ink sans" x="0" y="74" font-size="23" font-weight="650">an arbitrary Graph request.</text>

    <g class="sans" transform="translate(0 118)">
      <line class="rule" x1="0" y1="0" x2="420" y2="0"/>
      <text class="ink" x="0" y="37" font-size="15" font-weight="700">Identity</text>
      <text class="muted" x="146" y="37" font-size="15">tenant and principal</text>

      <line class="rule" x1="0" y1="58" x2="420" y2="58"/>
      <text class="ink" x="0" y="95" font-size="15" font-weight="700">Surface</text>
      <text class="muted" x="146" y="95" font-size="15">module and fixed tool</text>

      <line class="rule" x1="0" y1="116" x2="420" y2="116"/>
      <text class="ink" x="0" y="153" font-size="15" font-weight="700">Resource</text>
      <text class="muted" x="146" y="153" font-size="15">local allowlist</text>

      <line class="rule" x1="0" y1="174" x2="420" y2="174"/>
      <text class="ink" x="0" y="211" font-size="15" font-weight="700">Action</text>
      <text class="muted" x="146" y="211" font-size="15">read or explicit write</text>

      <line class="rule" x1="0" y1="232" x2="420" y2="232"/>
      <text class="ink" x="0" y="269" font-size="15" font-weight="700">Egress</text>
      <text class="muted" x="146" y="269" font-size="15">pinned Microsoft APIs</text>
      <line class="rule" x1="0" y1="290" x2="420" y2="290"/>
    </g>
  </g>

  <g class="mono" font-size="13">
    <text class="ink" x="66" y="461" font-weight="700">130 FIXED TOOLS</text>
    <text class="muted" x="244" y="461">99 READ</text>
    <text class="muted" x="358" y="461">27 OPT-IN WRITE</text>
    <text class="accent-text" x="530" y="461" font-weight="700">0 DELETE</text>
    <text class="muted" x="66" y="490">LOCAL STDIO</text>
    <text class="muted" x="232" y="490">ADMIN CONSENT</text>
    <text class="muted" x="394" y="490">OS KEYCHAIN</text>
    <text class="muted" x="530" y="490">RESULT EVIDENCE</text>
  </g>
</svg>
